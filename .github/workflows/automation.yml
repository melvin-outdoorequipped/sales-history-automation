
name: Drive Automation

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: 'Name of the new file'
        required: false
        default: ''
      folder_id:
        description: 'ID of the folder'
        required: false
        default: ''
      folder_name:
        description: 'Name of the folder'
        required: false
        default: ''

concurrency:
  group: drive-automation-${{ github.event.inputs.folder_id || 'all' }}
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas python-calamine google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 httplib2

      - name: Run Automation
        env:
          GOOGLE_TOKEN_PICKLE_B64: ${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}
          INPUT_FILE_NAME: ${{ github.event.inputs.file_name }}
          INPUT_FOLDER_ID: ${{ github.event.inputs.folder_id }}
          INPUT_FOLDER_NAME: ${{ github.event.inputs.folder_name }}
        run: python drive_automation.py
